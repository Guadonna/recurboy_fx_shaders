name: FB Growth collection
on:
  push:
    branches: [collections/fb-growth]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1-mesa-dev libgl1-mesa-dri
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/validate.py
        env:
          PYOPENGL_PLATFORM: egl
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: '1'
      - run: python tools/validate_color_controls.py
        env:
          PYOPENGL_PLATFORM: egl
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: '1'
      - run: python tools/validate_fronts.py
        env:
          PYOPENGL_PLATFORM: egl
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: '1'
      - run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: shader-validation
          path: artifacts/
