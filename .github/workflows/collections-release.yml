name: Publish unified collections
on:
  push:
    branches: [collections/fb-growth]
    paths: ['.github/workflows/collections-release.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: unified-collection-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: collections-v1.2.0
      RELEASE_VERSION: 1.2.0
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Require successful validation of every pinned source
        run: |
          python - <<'PY'
          import json, os, subprocess
          spec=json.load(open('releases/'+os.environ['RELEASE_TAG']+'.json'))
          for c in spec['collections']:
              endpoint='repos/'+os.environ['GH_REPO']+'/actions/runs/'+str(c['validation_run'])
              run=json.loads(subprocess.check_output(['gh','api',endpoint]))
              assert run['head_sha']==c['ref'] and run['conclusion']=='success', c['name']
          PY
      - uses: actions/checkout@v4
        with:
          ref: 5954672d286380bbd8a5f7946b75461e29954908
          path: build/fb-growth
      - uses: actions/checkout@v4
        with:
          ref: 9f3ed4b07575ab4bb08866cd79307e4e22917583
          path: build/feedback
      - uses: actions/checkout@v4
        with:
          ref: 587becdf1105a1f2c9de92b9f9af45ebd2fe44a8
          path: build/datamosh
      - uses: actions/checkout@v4
        with:
          ref: bfac7e30f96613bd67df8bc3f3efd80b51d3841b
          path: build/pixel-sorting
      - uses: actions/checkout@v4
        with:
          ref: c76af2511ab57716dc8e291fddc6b31d7e006e08
          path: build/displacement
      - uses: actions/checkout@v4
        with:
          ref: 336585e834e5d8c421dd0181706b86531ea31aba
          path: build/kaleidoscope
      - uses: actions/checkout@v4
        with:
          ref: 4e49ddc60171ba776a37e57308e2ea05ae44e910
          path: build/recursive
      - uses: actions/checkout@v4
        with:
          ref: ea99f68b3ca0458d71c8838d1667d4090aa5007d
          path: build/databending
      - uses: actions/checkout@v4
        with:
          ref: 513412e332cac5565b5d79c0fd88ffd805593ac1
          path: build/bitwise
      - uses: actions/checkout@v4
        with:
          ref: 7ea51d8ee4f1e39a89b4a03544610046bf94c482
          path: build/compression
      - uses: actions/checkout@v4
        with:
          ref: e1d76e1c825ce0119d33248610aa4c4a8126ef24
          path: build/wave
      - uses: actions/checkout@v4
        with:
          ref: 0c3844ff5da411cbc6bf18abdfd6d799956b6347
          path: build/phase
      - uses: actions/checkout@v4
        with:
          ref: d3c5df1ca6c2d713e19fa1c0303de600410fac08
          path: build/interference
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test device bundle structure
        run: python -m unittest discover -s tests -p test_package_all.py -v
      - name: Build and verify all archives
        run: python tools/build_release.py "releases/$RELEASE_TAG.json"
      - name: Publish without overwriting existing versions
        run: |
          set -euo pipefail
          if state=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            test "$state" = true || { echo 'Refusing to overwrite a published release'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --title "RecurBoy FX Collections $RELEASE_VERSION" --notes-file "releases/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" release-assets/*.zip release-assets/SHA256SUMS
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --title "RecurBoy FX Collections $RELEASE_VERSION" --notes-file "releases/$RELEASE_TAG.md"
