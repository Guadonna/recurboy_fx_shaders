name: Publish unified collections
on:
  push:
    branches: [collections/feedback]
    paths: ['.github/workflows/collections-release.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: unified-collection-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: collections-v1.1.0
      RELEASE_VERSION: 1.1.0
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Require successful validation of every pinned source
        run: |
          python - <<'PY'
          import json, os, subprocess
          spec=json.load(open('releases/'+os.environ['RELEASE_TAG']+'.json'))
          for c in spec['collections']:
              endpoint='repos/'+os.environ['GH_REPO']+'/actions/runs/'+str(c['validation_run'])
              run=json.loads(subprocess.check_output(['gh','api',endpoint]))
              assert run['head_sha']==c['ref'] and run['conclusion']=='success', c['name']
          PY
      - uses: actions/checkout@v4
        with:
          ref: be4df6690c501cda820be2556c4ab35227aad9a3
          path: build/feedback
      - uses: actions/checkout@v4
        with:
          ref: f603fec71ad1b1672d1edfa50035ef46a2c2d069
          path: build/datamosh
      - uses: actions/checkout@v4
        with:
          ref: b8227f2fc115ebbad2b0a0c22604d7948909bdba
          path: build/displacement
      - uses: actions/checkout@v4
        with:
          ref: f02aebfc627aac98064cb32b55ce91ebd9c49bc1
          path: build/kaleidoscope
      - uses: actions/checkout@v4
        with:
          ref: 6c19cc7d77b925f10bda84fb349481577f3cc8d6
          path: build/pixel-sorting
      - uses: actions/checkout@v4
        with:
          ref: deb4f50a3d09ec7ac5cd53deb0963924395253aa
          path: build/recursive
      - uses: actions/checkout@v4
        with:
          ref: adf5a2f001f4763f18860aca1b8c5ca5a3e1546a
          path: build/databending
      - uses: actions/checkout@v4
        with:
          ref: 2b29b20a093fd5651a309e5fed711f5ec1c6df44
          path: build/bitwise
      - uses: actions/checkout@v4
        with:
          ref: 013b99f9a427830f5a929ee4a01bb4d8c3788eaf
          path: build/compression
      - uses: actions/checkout@v4
        with:
          ref: d7d19a16d352a04e2b92dfe4dbd388761be0964d
          path: build/wave
      - uses: actions/checkout@v4
        with:
          ref: d39be081eeba6bb76546147813edbb509a613155
          path: build/phase
      - uses: actions/checkout@v4
        with:
          ref: 74ef60ac3f59da30235bd7cbcfc080408f48d36e
          path: build/interference
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify all archives
        run: python tools/build_release.py "releases/$RELEASE_TAG.json"
      - name: Publish without overwriting existing versions
        run: |
          set -euo pipefail
          if state=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            test "$state" = true || { echo 'Refusing to overwrite a published release'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --title "RecurBoy FX Collections $RELEASE_VERSION" --notes-file "releases/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" release-assets/*.zip release-assets/SHA256SUMS
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --title "RecurBoy FX Collections $RELEASE_VERSION" --notes-file "releases/$RELEASE_TAG.md"
