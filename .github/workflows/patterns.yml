name: Validate and release patterns
on:
  push:
    branches: [patterns]
    tags: ['patterns-v*']
  pull_request:
    branches: [patterns]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GLES test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1-mesa-dev libgles2-mesa-dev
          python -m pip install -r requirements-dev.txt
      - name: Test native PATTERN rendering and controls
        env:
          EGL_PLATFORM: surfaceless
        run: python tools/validate_pattern.py
      - name: Check generated files and archive layout
        run: |
          python tools/build_patterns.py
          git diff --exit-code -- Shaders collections manifest.json
          python -m unittest discover -s tests -v
      - name: Build and verify archives
        run: python tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: pattern-test-results
          path: |
            artifacts/*.json
            artifacts/*.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: pattern-release-assets
          path: dist/patterns-v0.2.1/
  release:
    if: startsWith(github.ref, 'refs/tags/patterns-v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pattern-release-assets
          path: dist
      - name: Publish new version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import sys; sys.path.insert(0, "tools"); from package import VERSION; print(VERSION)')
          test "$RELEASE_TAG" = "patterns-v$version"
          if state=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            test "$state" = true || { echo 'Refusing to overwrite a published release'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --target patterns --verify-tag --draft --prerelease --title "RecurBoy Patterns $version — 46 generators" --notes-file docs/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS
          gh release edit "$RELEASE_TAG" --target patterns --draft=false --prerelease --latest=false --notes-file docs/release-notes.md
